<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="augustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#augustGrad)" />
  
  <!-- Open Guide Book Illustration -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 28 40 C 44 38, 58 43, 62 48 L 62 92 C 58 87, 44 83, 28 85 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Right Page -->
    <path d="M 100 40 C 84 38, 70 43, 66 48 L 66 92 C 70 87, 84 83, 100 85 Z" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Step / Guide Lines Left Page -->
    <rect x="36" y="52" width="18" height="4" rx="2" fill="#E64A19" opacity="0.6"/>
    <rect x="36" y="62" width="14" height="3" rx="1.5" fill="#B0BEC5"/>
    <rect x="36" y="70" width="16" height="3" rx="1.5" fill="#B0BEC5"/>
    
    <!-- Step / Guide Lines Right Page -->
    <rect x="74" y="52" width="18" height="4" rx="2" fill="#E64A19" opacity="0.6"/>
    <rect x="74" y="62" width="16" height="3" rx="1.5" fill="#B0BEC5"/>
    <rect x="74" y="70" width="12" height="3" rx="1.5" fill="#B0BEC5"/>
  </g>
  
  <!-- Marker Pin Badge at Top Right of Book -->
  <circle cx="94" cy="34" r="12" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="94" cy="34" r="4.5" fill="#FFFFFF"/>
</svg>
